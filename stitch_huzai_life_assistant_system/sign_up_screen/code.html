<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col premium-bg selection:bg-surface-container-high selection:text-primary">
<!-- Transactional Screen: Navigation Shell Suppressed -->
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<div class="w-full max-w-md bg-surface border border-surface-container-high rounded-xl p-stack-lg md:p-12 relative overflow-hidden">
<!-- Subtle ambient glow in the corner of the card -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-surface-container-highest rounded-full blur-[60px] opacity-30 pointer-events-none"></div>
<!-- Brand Anchor -->
<div class="flex justify-center mb-stack-md"><div class="bg-surface-container-lowest p-2 rounded-lg"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqAqJK09fZFDS-zj1S52XcnLyPkeDaQeZSN7jzve15FnGdnrKj6Pbe9dbpDjm_UFUHnw4kHlnGufUhgrLX0yjLZUXfMvoWoBuuGPStCI05bMHtSRlTN08014jtK8jnXJ4TG3fwiQCCrLTUK3zC93l1NxA6agBc3LUXMoghHrh7m-k2VejIperShUqncpD7gjoEEs5W52HvwA2T-rRynhjzDC8WSsMIy0sAqYiOzwKFkbrF6BHNuRs-aw" alt="huzAI Logo" class="h-12 w-auto"></div></div>
<div class="text-center mb-stack-lg">
<h1 class="font-headline-md text-headline-md text-primary mb-unit">Create your huzAI account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join to start your journey with a premium AI life partner.</p>
</div>
<form aria-label="Sign Up Form" class="flex flex-col gap-stack-md">
<!-- Full Name Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-secondary" for="fullName">Full Name</label>
<div class="relative flex items-center bg-surface-container-lowest border border-surface-container-high rounded-lg ai-input-focus transition-colors duration-200">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none" data-icon="person" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-transparent border-none text-primary font-body-md pl-10 pr-4 py-3 rounded-lg focus:ring-0 placeholder-outline-variant" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-secondary" for="email">Email Address</label>
<div class="relative flex items-center bg-surface-container-lowest border border-surface-container-high rounded-lg ai-input-focus transition-colors duration-200">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none" data-icon="mail" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-transparent border-none text-primary font-body-md pl-10 pr-4 py-3 rounded-lg focus:ring-0 placeholder-outline-variant" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-secondary" for="password">Password</label>
<div class="relative flex items-center bg-surface-container-lowest border border-surface-container-high rounded-lg ai-input-focus transition-colors duration-200">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none" data-icon="lock" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-transparent border-none text-primary font-body-md pl-10 pr-10 py-3 rounded-lg focus:ring-0 placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-secondary" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center bg-surface-container-lowest border border-surface-container-high rounded-lg ai-input-focus transition-colors duration-200">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none" data-icon="lock_reset" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
<input class="w-full bg-transparent border-none text-primary font-body-md pl-10 pr-10 py-3 rounded-lg focus:ring-0 placeholder-outline-variant" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-unit">
<div class="flex items-center h-5">
<input class="w-4 h-4 bg-surface-container-lowest border-outline rounded text-primary focus:ring-primary focus:ring-offset-background cursor-pointer" id="terms" name="terms" required="" type="checkbox">
</div>
<label class="ml-3 font-body-md text-sm text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:underline transition-all" href="#">Terms</a> and <a class="text-primary hover:underline transition-all" href="#">Privacy Policy</a>
</label>
</div>
<!-- Actions -->
<div class="mt-stack-sm flex flex-col gap-gutter">
<button class="w-full bg-primary text-background font-label-sm text-label-sm py-3 px-6 rounded-lg hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<div class="text-center mt-unit">
<a class="font-body-md text-sm text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">
                            Already have an account? <span class="text-primary font-medium">Log in</span>
</a>
</div>
</div>
</form>
</div>
</main>

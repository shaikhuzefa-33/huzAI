<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md overflow-hidden">
<!-- Split Screen Layout -->
<div class="flex w-full min-h-screen bg-surface-container-lowest">
<!-- Left Side: Branding (Hidden on mobile) -->
<div class="hidden md:flex flex-col justify-between w-1/2 p-container-padding-desktop bg-surface-container-lowest relative overflow-hidden">
<!-- Decorative blur element -->
<div class="absolute -top-[20%] -left-[10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-3xl mix-blend-screen pointer-events-none"></div>
<div class="relative z-10">
<div class="bg-black p-2 rounded-lg inline-block"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqAqJK09fZFDS-zj1S52XcnLyPkeDaQeZSN7jzve15FnGdnrKj6Pbe9dbpDjm_UFUHnw4kHlnGufUhgrLX0yjLZUXfMvoWoBuuGPStCI05bMHtSRlTN08014jtK8jnXJ4TG3fwiQCCrLTUK3zC93l1NxA6agBc3LUXMoghHrh7m-k2VejIperShUqncpD7gjoEEs5W52HvwA2T-rRynhjzDC8WSsMIy0sAqYiOzwKFkbrF6BHNuRs-aw" alt="huzAI Logo" class="h-12 w-auto"></div>
</div>
<div class="relative z-10 max-w-md">
<h2 class="font-display-lg text-display-lg text-on-surface mb-stack-md">Your life,<br><span class="text-on-surface-variant">simplified with AI.</span></h2>
</div>
<div class="relative z-10 flex items-center space-x-unit">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">System Operational</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="flex-1 flex flex-col justify-center items-center p-container-padding-mobile md:p-container-padding-desktop bg-surface relative z-20">
<!-- Mobile Logo -->
<div class="md:hidden mb-stack-lg w-full max-w-sm text-center">
<div class="bg-black p-2 rounded-lg inline-block mx-auto"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqAqJK09fZFDS-zj1S52XcnLyPkeDaQeZSN7jzve15FnGdnrKj6Pbe9dbpDjm_UFUHnw4kHlnGufUhgrLX0yjLZUXfMvoWoBuuGPStCI05bMHtSRlTN08014jtK8jnXJ4TG3fwiQCCrLTUK3zC93l1NxA6agBc3LUXMoghHrh7m-k2VejIperShUqncpD7gjoEEs5W52HvwA2T-rRynhjzDC8WSsMIy0sAqYiOzwKFkbrF6BHNuRs-aw" alt="huzAI Logo" class="h-10 w-auto"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-sm bg-surface-container-low border border-surface-container-high rounded-xl p-stack-md flex flex-col gap-stack-md relative overflow-hidden">
<!-- Inner soft glow -->
<div class="absolute -top-[50px] -right-[50px] w-[200px] h-[200px] bg-primary/5 rounded-full blur-2xl pointer-events-none"></div>
<div class="relative z-10">
<h2 class="font-headline-md text-headline-md text-primary mb-unit">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to access your personal AI assistant.</p>
</div>
<form class="flex flex-col gap-stack-sm relative z-10">
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">mail</span>
<input class="w-full bg-surface border border-surface-container-high rounded-lg py-2 pl-10 pr-3 text-on-surface font-body-md focus:border-outline-variant focus:ring-0 transition-colors" id="email" placeholder="name@example.com" type="email">
</div>
</div>
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-surface transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">lock</span>
<input class="w-full bg-surface border border-surface-container-high rounded-lg py-2 pl-10 pr-3 text-on-surface font-body-md focus:border-outline-variant focus:ring-0 transition-colors" id="password" placeholder="••••••••" type="password">
</div>
</div>
<button class="mt-unit w-full bg-primary text-on-primary font-label-sm text-label-sm py-3 rounded-lg hover:scale-95 active:scale-90 transition-transform flex items-center justify-center gap-unit" type="submit">
<span class="">Log In</span>
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<div class="relative z-10 flex items-center gap-unit py-unit">
<div class="h-px bg-surface-container-high flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="h-px bg-surface-container-high flex-1"></div>
</div>
<button class="relative z-10 w-full bg-transparent border border-surface-container-high text-on-surface font-label-sm text-label-sm py-3 rounded-lg hover:bg-surface-variant hover:border-outline-variant hover:scale-95 active:scale-90 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 18px;">login</span>
<span class="">Continue with Google</span>
</button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-unit relative z-10">
                    Don't have an account? <a class="text-primary hover:text-on-surface transition-colors" href="#">Create account</a>
</p>
</div>
<!-- Subtle footer links for desktop -->
<div class="absolute bottom-stack-md flex gap-stack-md font-label-sm text-label-sm text-on-surface-variant hidden md:flex">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>

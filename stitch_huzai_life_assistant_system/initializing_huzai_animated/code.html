<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_29');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;

void main() {
    vec2 uv = v_texCoord;
    
    // Create a pulsing glow effect from the center
    vec2 center = vec4(0.5, 0.5, 0.5, 0.5).xy;
    float dist = distance(uv, center);
    
    // Core pulse
    float pulse = 0.5 + 0.5 * sin(u_time * 1.5);
    float glow = exp(-dist * 8.0) * (0.8 + 0.2 * pulse);
    
    // Subtle scanning line
    float scan = smoothstep(0.48, 0.5, abs(fract(uv.y - u_time * 0.1) - 0.5));
    
    // huzAI Blue/Purple palette
    vec3 color1 = vec3(0.0, 0.5, 1.0); // Cyan/Blue
    vec3 color2 = vec3(0.5, 0.0, 1.0); // Purple
    vec3 finalColor = mix(color1, color2, uv.y + 0.2 * sin(u_time));
    
    // Apply background darkening
    finalColor *= glow;
    finalColor += 0.05 * scan * color1;
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusMessages = [
                'Establishing secure connection...',
                'Syncing your documents...',
                'Optimizing AI assistant for your preferences...',
                'Preparing your dashboard...',
                'Finalizing setup...'
            ];
            
            const statusTextElement = document.getElementById('status-text');
            const progressBar = document.getElementById('progress-bar');
            const percentageText = document.getElementById('percentage-text');
            
            let currentMessageIndex = 0;
            let currentProgress = 0;

            // Rotate messages
            setInterval(() => {
                // The animation cycle is 3s. We change text when it's invisible (roughly 1.5s in or at start of loop).
                // Actually, CSS animation handles opacity. Just change text slightly out of sync to ensure it changes while hidden.
                setTimeout(() => {
                    currentMessageIndex = (currentMessageIndex + 1) % statusMessages.length;
                    statusTextElement.textContent = statusMessages[currentMessageIndex];
                }, 1500); // Change text halfway through the 3s fade cycle
            }, 3000);

            // Simulate progress
            const progressInterval = setInterval(() => {
                // Randomly increase progress between 1 and 8 percent
                const increment = Math.floor(Math.random() * 8) + 1;
                currentProgress += increment;
                
                if (currentProgress > 99) {
                    currentProgress = 99; // Hold at 99% until 'done'
                    clearInterval(progressInterval);
                    
                    // Simulate completion transition after holding at 99%
                    setTimeout(() => {
                        currentProgress = 100;
                        updateProgressUI();
                        // In a real app, window.location.href = '/dashboard' would happen here
                    }, 2000);
                }
                
                updateProgressUI();
            }, 500);

            function updateProgressUI() {
                progressBar.style.width = `${currentProgress}%`;
                percentageText.textContent = `${currentProgress}%`;
            }
        });
    </script>
